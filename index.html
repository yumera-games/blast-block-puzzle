<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="Project BLAST BLOCK — Phase 1 Gray Box">
<title>BLAST BLOCK — Phase 1</title>
<link rel="icon" href="data:,">
<!-- ホーム画面からの起動（工程 W-7）。**viewport 設定は変更していない。**
     公開先がサブパス /blast-block-puzzle/ なので、`/` 始まりで書いて
     Vite の base（'./'）に書き換えさせる。ローカル開発でもそのまま解決できる。 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0d18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- content は black。**画面がステータスバーの下へ潜り込まない**ので、
     HUD やボタンが時計に隠れる余地を作らない。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BLAST BLOCK">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <div id="hud"></div>
    <div id="stage-wrap"><div id="game"></div></div>
    <div id="hint"></div>
    <div id="controls">
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn" id="btnStages">STAGE</button>
      <button class="btn narrow" id="btnSoundMain" aria-pressed="true" aria-label="効果音をオフにする">♪</button>
      <button class="btn narrow" id="btnDebug">DBG</button>
    </div>
  </div>
  <div id="overlay"><div class="card" id="overlayCard"></div></div>
  <div id="debug"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
